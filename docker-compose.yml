version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: jewela_db
    environment:
      MYSQL_ROOT_PASSWORD: 1279
      MYSQL_DATABASE: jewela
      MYSQL_USER: user
      MYSQL_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
